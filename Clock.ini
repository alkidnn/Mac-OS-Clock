[Rainmeter]
Update=1000
AccurateText=1

;;; SCALE CHANGER
MouseScrollUpAction=[!SetVariable Scale (Min(12.0,Round((#Scale#+#ScrollMouseIncrement#)*10)/10)) ][!WriteKeyValue Variables Scale (Min(12.0,Round((#Scale#+#ScrollMouseIncrement#)*10)/10)) #@#Variables.inc ][!Refresh]
MouseScrollDownAction=[!SetVariable Scale (Max(1.0,Round((#Scale#-#ScrollMouseIncrement#)*10)/10)) ][!WriteKeyValue Variables Scale (Max(1.0,Round((#Scale#-#ScrollMouseIncrement#)*10)/10)) #@#Variables.inc ][!Refresh]

[Metadata]
Name=MacOS clock
Author=notmangoytvr
Version=1.0
Information=Mac OS clock

[Variables]
@include=#@#Variables.inc
Color=255,255,255,179

[MeasureTime]
Measure=Time
Format=%#H:%M:%S

; Увеличили ширину контейнера с 120 до 185, чтобы вместить секунды с запасом
[MeterSolid]
Meter=Shape
Shape=Rectangle (0*#Scale#),(0*#Scale#),(185*#Scale#),(45*#Scale#),1 | Fill Color 0,0,0,1 | StrokeWidth 0 | Stroke Color 0,0,0,0
X=(0*#Scale#)
Y=(0*#Scale#)
DynamicVariables=1

[Clock]
Meter=String
MeasureName=MeasureTime
StringAlign=Left
FontFace=SF Pro Rounded
FontWeight=300
FontColor=#Color#
FontSize=(35*#Scale#)
X=(10*#Scale#)
Y=(-4*#Scale#)
AntiAlias=1
Text=%1
InlineSetting=CharacterSpacing | -1.5 | -1.5
; Включаем табличные цифры (одинаковая ширина для всех цифр 0-9)
InlineSetting2=Typography | tnum
DynamicVariables=1
